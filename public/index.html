<!DOCTYPE html>
<html lang="th">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>ระบบสมาชิก</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <header>
 <h1>ระบบสมาชิก</h1>
 </header>

 <main>
 <p id="message"></p>

 <div class="forms">
 <section>
 <h2>สมัครสมาชิก</h2>
 <form id="register-form">
 <input name="username" placeholder="username (a-z, 0-9, _)" required>
 <input name="name" placeholder="ชื่อ-นามสกุล" required>
 <input name="email" type="email" placeholder="อีเมล" required>
 <input name="password" type="password" placeholder="รหัสผ่าน (อย่างน้อย 8 ตัว)" minlength="8" required>
 <button type="submit">สมัครสมาชิก</button>
 </form>
 </section>

 <section>
 <h2>เข้าสู่ระบบ</h2>
 <form id="login-form">
 <input name="username" placeholder="username" required>
 <input name="password" type="password" placeholder="รหัสผ่าน" required>
 <button type="submit">เข้าสู่ระบบ</button>
 </form>
 </section>
 </div>

 <section>
 <h2>สมาชิกทั้งหมด</h2>
 <input id="search-box" type="search" placeholder="ค้นหาสมาชิกตามชื่อ">
 <div class="table-wrap">
 <table>
 <thead>
 <tr><th>username</th><th>ชื่อ</th><th>อีเมล</th><th>role</th><th></th></tr>
 </thead>
 <tbody id="user-table"></tbody>
 </table>
 </div>
 </section>
 </main>

 <script src="script.js"></script>
</body>
</html>
